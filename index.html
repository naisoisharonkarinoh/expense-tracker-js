<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 100%);
      }

      .tracker-shell {
        max-width: 900px;
        margin: 3rem auto;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 1rem;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
      }

      .form-control,
      .form-select {
        border-radius: 0.75rem;
      }

      .table thead th {
        background: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tracker-shell p-4 p-md-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
          <div>
            <p class="text-primary fw-semibold mb-1 text-uppercase small">Budget dashboard</p>
            <h1 class="mb-0">Expense Tracker</h1>
          </div>
          <span class="badge bg-success-subtle text-success-emphasis rounded-pill px-3 py-2 mt-3 mt-md-0">
            Live Overview
          </span>
        </div>

        <form id="expense-form" class="row g-3 mb-4">
          <div class="col-md-4">
            <label for="expense-name" class="form-label fw-semibold">Expense Name</label>
            <input id="expense-name" type="text" class="form-control" placeholder="e.g. Rent" required />
          </div>

          <div class="col-md-4">
            <label for="expense-amount" class="form-label fw-semibold">Amount</label>
            <input id="expense-amount" type="number" class="form-control" min="0.01" step="0.01" placeholder="0.00" required />
          </div>

          <div class="col-md-3">
            <label for="expense-category" class="form-label fw-semibold">Category</label>
            <select id="expense-category" class="form-select" required>
              <option value="">Select category</option>
              <option value="Housing">Housing</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Utilities">Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="col-md-1 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Add</button>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Category</th>
                <th scope="col">Amount</th>
              </tr>
            </thead>
            <tbody id="expense-table-body"></tbody>
            <tfoot>
              <tr class="fw-bold fs-5">
                <td colspan="2">Total Expenses</td>
                <td id="total-amount">$0.00</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
